<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dragon Connector HQ</title>
  <meta name="description" content="The private dashboard for the Dragon Connector organizers, judges and check-in crew.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B0B0B">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../styles/app.css">
  <link rel="stylesheet" href="hq.css">
  <script type="module" src="main.js"></script>
</head>
<body class="hq">
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar" id="topbar"></header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="HQ sections"></nav>
    <main id="view" tabindex="-1">
      <p class="muted">Loading HQ…</p>
      <noscript><p class="notice">HQ needs JavaScript to run.</p></noscript>
    </main>
  </div>
  <div id="tip" class="chart-tip" role="tooltip" hidden></div>
  <div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
